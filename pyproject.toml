[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aymaw-synapse-etl"
version = "0.1.0"
description = "Schema-mapping agents with evidence, deterministic validation, and transactional ingestion."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Ayma Waqar"}]
readme = "README.md"
dependencies = []

[project.scripts]
synapse-etl = "synapse_etl.cli:main"

[tool.setuptools.packages.find]
include = ["synapse_etl*"]

[project.optional-dependencies]
dev = ["ruff==0.17.3", "build==1.6.1", "setuptools==84.2.1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
